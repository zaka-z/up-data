<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت فروشگاه</title>
  <style>
/* =========================================================
   TRUSTED ADMIN THEME
   بدون تغییر در HTML / JS / Schema / ID / Class
   تمرکز: خوانایی، اعتماد، نظم، ظاهر کاربردی
========================================================= */

:root {
  --page-bg: #f5f7fb;
  --surface: #ffffff;
  --surface-soft: #f9fbfd;
  --surface-alt: #eef3f8;

  --text: #102033;
  --text-strong: #0b1524;
  --text-muted: #5f7187;

  --border: #d9e2ec;
  --border-strong: #c5d2df;

  --primary: #2463eb;
  --primary-hover: #1d4ed8;
  --primary-soft: rgba(36, 99, 235, 0.08);

  --secondary: #64748b;
  --success: #15803d;
  --warning: #b45309;
  --danger: #b91c1c;

  --shadow-sm: 0 1px 2px rgba(16, 32, 51, 0.05);
  --shadow-md: 0 8px 24px rgba(16, 32, 51, 0.08);
  --shadow-lg: 0 16px 40px rgba(16, 32, 51, 0.10);

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;

  --transition: 0.18s ease;
  --font: "Vazirmatn", "IRANSans", "Segoe UI", Tahoma, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  direction: rtl;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(circle at top right, rgba(36, 99, 235, 0.06), transparent 30%),
    radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.05), transparent 28%),
    linear-gradient(180deg, #f9fbff 0%, var(--page-bg) 100%);
}

/* App Shell */
.app-container {
  max-width: 1500px;
  margin: 0 auto;
  padding: 22px;
}

/* Navbar */
.navbar {
  position: sticky;
  top: 12px;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  padding: 12px 14px;
  margin-bottom: 22px;

  border: 1px solid rgba(217, 226, 236, 0.9);
  border-radius: var(--radius-xl);
  background: rgba(255, 255, 255, 0.86);
  box-shadow: var(--shadow-md);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.nav-tabs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.nav-tab {
  appearance: none;
  border: 1px solid transparent;
  outline: none;
  cursor: pointer;

  min-height: 44px;
  padding: 10px 18px;
  border-radius: 14px;

  background: transparent;
  color: var(--text-muted);

  font-family: inherit;
  font-size: 14px;
  font-weight: 700;

  transition:
    background var(--transition),
    color var(--transition),
    border-color var(--transition),
    box-shadow var(--transition),
    transform var(--transition);
}

.nav-tab:hover {
  color: var(--text-strong);
  background: var(--primary-soft);
  border-color: rgba(36, 99, 235, 0.10);
  transform: translateY(-1px);
}

.nav-tab.active {
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #1d7be6);
  box-shadow: 0 10px 22px rgba(36, 99, 235, 0.18);
}

/* Clear cache button */
.clear-cache-btn {
  appearance: none;
  border: 1px solid rgba(220, 38, 38, 0.16);
  outline: none;
  cursor: pointer;

  min-height: 44px;
  padding: 10px 16px;
  border-radius: 14px;

  background: #fff5f5;
  color: #991b1b;

  font-family: inherit;
  font-size: 13px;
  font-weight: 800;

  transition:
    background var(--transition),
    color var(--transition),
    border-color var(--transition),
    box-shadow var(--transition),
    transform var(--transition);
}

.clear-cache-btn:hover {
  color: #fff;
  background: linear-gradient(135deg, #ef4444, #dc2626);
  border-color: rgba(220, 38, 38, 0.18);
  box-shadow: 0 12px 24px rgba(220, 38, 38, 0.18);
  transform: translateY(-1px);
}

/* Tabs */
.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
  animation: fadeUp 0.24s ease both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Panels */
.panel {
  position: relative;
  overflow: hidden;

  margin-bottom: 20px;
  padding: 22px;

  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: var(--shadow-sm);
  transition:
    box-shadow var(--transition),
    border-color var(--transition),
    transform var(--transition);
}

.panel:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-lg);
}

.panel::before {
  content: "";
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), #0ea5e9, #22c55e);
}

.panel-title {
  display: flex;
  align-items: center;
  gap: 10px;

  margin-bottom: 18px;
  padding-bottom: 12px;

  border-bottom: 1px solid #e8eef4;
  color: var(--text-strong);

  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.2px;
}

.panel-title::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 4px;
  background: linear-gradient(135deg, var(--primary), #0ea5e9);
  box-shadow: 0 0 0 6px rgba(36, 99, 235, 0.08);
}

/* Forms */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px 16px;
}

.form-grid label {
  display: block;
  margin-bottom: 6px;
  color: var(--text-muted);
  font-size: 12.5px;
  font-weight: 700;
}

.form-grid input,
.form-grid select,
.form-grid textarea,
input,
select,
textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;

  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;

  background: var(--surface-soft);
  color: var(--text);

  font-family: inherit;
  font-size: 14px;
  font-weight: 600;

  transition:
    border-color var(--transition),
    box-shadow var(--transition),
    background var(--transition),
    transform var(--transition);
}

.form-grid textarea,
textarea {
  min-height: 96px;
  resize: vertical;
  line-height: 1.8;
}

.form-grid input:hover,
.form-grid select:hover,
.form-grid textarea:hover,
input:hover,
select:hover,
textarea:hover {
  border-color: var(--border-strong);
}

.form-grid input:focus,
.form-grid select:focus,
.form-grid textarea:focus,
input:focus,
select:focus,
textarea:focus {
  border-color: rgba(36, 99, 235, 0.9);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(36, 99, 235, 0.10);
  transform: translateY(-1px);
}

input::placeholder,
textarea::placeholder {
  color: #94a3b8;
}

select {
  cursor: pointer;
}

/* Helper boxes */
.helper-box {
  margin-top: 12px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid #dbe4ee;
  background: linear-gradient(180deg, #fbfdff 0%, #f6f9fc 100%);
  color: var(--text-muted);
  line-height: 1.8;
  font-size: 13px;
}

.helper-box:empty {
  display: none;
}

#salesProductHelper {
  border-right: 4px solid #64748b;
}

#salesStockEffectHelper {
  border-right: 4px solid var(--primary);
}

#interactionsProductHelper {
  border-right: 4px solid #0ea5e9;
}

/* Buttons */
.button-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;

  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #e8eef4;
}

.btn {
  appearance: none;
  border: 1px solid transparent;
  outline: none;
  cursor: pointer;

  min-height: 44px;
  padding: 11px 18px;
  border-radius: 12px;

  font-family: inherit;
  font-size: 14px;
  font-weight: 800;

  transition:
    background var(--transition),
    color var(--transition),
    border-color var(--transition),
    box-shadow var(--transition),
    transform var(--transition);
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #1d7be6);
  box-shadow: 0 10px 22px rgba(36, 99, 235, 0.16);
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-hover), #1463d6);
  box-shadow: 0 14px 28px rgba(36, 99, 235, 0.20);
}

.btn-secondary {
  color: var(--text);
  background: #fff;
  border-color: var(--border);
}

.btn-secondary:hover {
  background: #f8fbff;
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

/* Tables */
.table-container {
  overflow: auto;
  max-height: 520px;
  margin-top: 16px;

  border: 1px solid #dbe4ee;
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--shadow-sm);
}

table {
  width: 100%;
  min-width: 900px;
  border-collapse: collapse;
  direction: rtl;
  color: var(--text);
}

thead th {
  position: sticky;
  top: 0;
  z-index: 5;

  padding: 14px 12px;
  border-bottom: 1px solid #dbe4ee;

  background: linear-gradient(180deg, #f8fbff 0%, #eaf0f6 100%);
  color: var(--text-strong);

  font-size: 12.8px;
  font-weight: 800;
  text-align: right;
  white-space: nowrap;
}

tbody td {
  padding: 12px 12px;
  border-bottom: 1px solid #edf2f7;
  background: #fff;
  color: var(--text-muted);
  font-size: 12.8px;
  font-weight: 600;
  white-space: nowrap;
}

tbody tr:nth-child(even) td {
  background: #fbfdff;
}

tbody tr:hover td {
  background: #f3f8ff;
}

tbody tr:last-child td {
  border-bottom: none;
}

/* Inputs inside tables */
.table-container input,
.table-container select,
.table-container textarea {
  min-height: 38px;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 12.5px;
  background: #fff;
}

.table-container textarea {
  min-height: 70px;
}

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;

  margin-top: 14px;
}

.pagination button {
  appearance: none;
  border: 1px solid var(--border);
  outline: none;
  cursor: pointer;

  min-width: 38px;
  height: 38px;
  padding: 0 12px;
  border-radius: 10px;

  background: #fff;
  color: var(--text-muted);

  font-family: inherit;
  font-size: 13px;
  font-weight: 700;

  transition:
    background var(--transition),
    color var(--transition),
    border-color var(--transition),
    transform var(--transition);
}

.pagination button:hover:not(:disabled) {
  background: #eef4ff;
  color: var(--primary);
  border-color: rgba(36, 99, 235, 0.28);
  transform: translateY(-1px);
}

.pagination button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.pagination span {
  min-width: 38px;
  height: 38px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), #1d7be6);
  color: #fff;

  font-size: 13px;
  font-weight: 800;
}

/* Logs */
.log-area {
  width: 100%;
  height: 420px;
  resize: vertical;

  direction: ltr;
  text-align: left;

  padding: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 16px;

  background:
    radial-gradient(circle at top left, rgba(34, 197, 94, 0.08), transparent 28%),
    linear-gradient(135deg, #0b1220, #111827);
  color: #d1fae5;

  font-family: Consolas, "Courier New", monospace;
  font-size: 13px;
  line-height: 1.8;

  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

/* Validation states */
.invalid,
input.invalid,
select.invalid,
textarea.invalid {
  border-color: rgba(220, 38, 38, 0.8) !important;
  background: rgba(254, 242, 242, 0.95) !important;
  box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.10) !important;
}

.valid,
input.valid,
select.valid,
textarea.valid {
  border-color: rgba(22, 163, 74, 0.7) !important;
  background: rgba(240, 253, 244, 0.95) !important;
}

/* Scrollbars */
* {
  scrollbar-width: thin;
  scrollbar-color: #94a3b8 #e2e8f0;
}

::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-track {
  background: #e2e8f0;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #94a3b8, #64748b);
  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #64748b, #475569);
}

/* Responsive */
@media (max-width: 980px) {
  .app-container {
    padding: 16px;
  }

  .navbar {
    flex-direction: column;
    align-items: stretch;
  }

  .nav-tabs {
    width: 100%;
    justify-content: center;
  }

  .clear-cache-btn {
    width: 100%;
  }

  .panel {
    padding: 18px;
  }

  .form-grid {
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }
}

@media (max-width: 640px) {
  body {
    background: #f5f7fb;
  }

  .app-container {
    padding: 12px;
  }

  .navbar {
    top: 8px;
    margin-bottom: 18px;
    border-radius: 18px;
  }

  .nav-tab {
    padding: 10px 12px;
    font-size: 12px;
  }

  .panel {
    padding: 16px;
    border-radius: 18px;
  }

  .panel-title {
    font-size: 16px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .button-row {
    flex-direction: column;
    align-items: stretch;
  }

  .btn {
    width: 100%;
  }

  .table-container {
    max-height: 460px;
  }

  table {
    min-width: 760px;
  }
}

/* =========================================================
   اصلاح چیدمان ردیف‌های داینامیک فروش (افقی و راست به چپ)
   ========================================================= */

/* کانتینر دربرگیرنده کل ردیف‌ها */
#salesLineItemsContainer {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 15px;
  width: 100%;
}

/* استایل هر ردیف تراکنش به صورت افقی */
.sales-row-item {
  display: flex;
  flex-direction: row-reverse; /* راست به چپ کردن فیلدها */
  flex-wrap: wrap;            /* شکستن ایمن در صورت کمبود جا */
  align-items: flex-end;      /* تراز شدن فیلدها و دکمه حذف هم سطح با هم */
  gap: 12px;
  padding: 16px;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: border-color var(--transition), box-shadow var(--transition);
}

.sales-row-item:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

/* استایل کانتینر هر فیلد در ردیف برای هم‌ترازی لیبل و اینپوت */
.sales-row-item > div {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 130px; /* جلوگیری از جمع شدن و ریز شدن بیش از حد فیلدها */
}

/* لیبل‌های بالای هر اینپوت در ردیف */
.sales-row-item label {
  display: block;
  margin-bottom: 6px;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

/* دکمه حذف ردیف (در صورت وجود در فایل‌های JS) */
.sales-row-item .remove-row-btn {
  min-height: 44px;
  padding: 0 16px;
  background: #fff5f5;
  color: #991b1b;
  border: 1px solid rgba(220, 38, 38, 0.16);
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  font-family: inherit;
  transition: all var(--transition);
}

.sales-row-item .remove-row-btn:hover {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  border-color: transparent;
}

/* ریسپانسیو ردیف‌ها در صفحه نمایش‌های کوچک */
@media (max-width: 768px) {
  .sales-row-item {
    flex-direction: column;
    align-items: stretch;
  }
  .sales-row-item > div {
    width: 100%;
  }
}


  </style>
</head>
<body>
  <div class="app-container">
    <!-- Navbar -->
    <div class="navbar">
      <div class="nav-tabs">
        <button class="nav-tab active" data-tab="sales">فروش</button>
        <button class="nav-tab" data-tab="interactions">تعامل</button>
        <button class="nav-tab" data-tab="inventory">انبار</button>
        <button class="nav-tab" data-tab="logs">Logs</button>
      </div>
      <button class="clear-cache-btn" id="clearCacheBtn">پاک کردن کش</button>
    </div>

    <!-- Sales Tab -->
    <div class="tab-content active" id="tab-sales">
      <div class="panel">
        <div class="panel-title">سیستم پیشرفته ثبت فروش چندردیفی</div>
        
        <!-- ۱. هدر ثابت تراکنش (شناسه، تاریخ، زمان و...) -->
        <div id="salesHeaderGrid" class="form-grid" style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px;">
          <!-- توسط فاکشن generateFormFields پر می‌شود -->
        </div>

        <!-- ۲. کانتینر ردیف‌های پویا (آیتم‌های کالا) -->
        <div style="margin-top: 10px; border-top: 2px solid #3498db; padding-top: 15px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0; font-size: 1.1em;">آیتم‌های تراکنش</h3>
            <button type="button" class="btn btn-secondary" onclick="addSalesRow()" style="background: #27ae60; color: white; border: none; padding: 5px 15px; cursor: pointer;">+ افزودن ردیف محصول</button>
          </div>
          
          <div id="salesLineItemsContainer">
            <!-- ردیف‌های فروش به صورت داینامیک اینجا تزریق می‌شوند -->
          </div>
        </div>

        <!-- ۳. بخش محاسبات و فوتر عملیاتی -->
        <div id="salesFormFooter" style="margin-top: 20px; padding: 15px; background: #eef2f7; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; border: 1px solid #cfd8dc;">
          <div style="flex: 1; min-width: 200px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">مجموع مبالغ برگشتی/تعویض:</label>
            <input type="number" id="totalRefundAmount" readonly style="width: 100%; padding: 8px; border: 1px solid #ccc; background: #fff; color: #d32f2f; font-weight: bold;">
          </div>
          <div style="flex: 1; min-width: 200px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">سود خالص نهایی تراکنش:</label>
            <input type="number" id="netProfitAmount" readonly style="width: 100%; padding: 8px; border: 1px solid #ccc; background: #fff; color: #1b5e20; font-weight: bold;">
          </div>
        </div>

        <!-- ۴. ابزارهای کمکی و دکمه‌های اصلی -->
        <div style="margin-top: 20px; display: flex; gap: 10px;">
          <button class="btn btn-secondary" id="openSalesCSV">بارگذاری دیتابیس (CSV)</button>
          <button class="btn btn-primary" id="addSalesRecord" style="background: #3498db; flex-grow: 1;">ثبت نهایی تراکنش در سیستم</button>
        </div>
        
        <!-- مخفی نگه داشتن کانتینر قدیمی برای جلوگیری از شکستن کدهای قبلی -->
        <div id="salesFormGrid" style="display: none;"></div>
      </div>

      <!-- ۵. جدول نمایش رکوردها -->
      <div class="panel">
        <div class="panel-title">تاریخچه تراکنش‌های ثبت شده</div>
        <div class="table-container" id="salesTableContainer"></div>
        <div class="pagination" id="salesPagination"></div>
      </div>
    </div>

    <!-- Interactions Tab -->
    <div class="tab-content" id="tab-interactions">
      <div class="panel">
        <div class="panel-title">جدول تعاملات محصولی</div>
        <div class="button-row">
          <button class="btn btn-secondary" id="openInteractionsCSV">Open CSV</button>
          <button class="btn btn-primary" id="addInteractionRow">افزودن ردیف</button>
          <button class="btn btn-primary" id="saveInteractionsCSV">ذخیره تعاملات</button>
        </div>
        <div class="table-container" id="interactionsTableContainer"></div>
        <div class="pagination" id="interactionsPagination"></div>
      </div>
    </div>

    <!-- Inventory Tab -->
    <div class="tab-content" id="tab-inventory">
      <div class="panel">
